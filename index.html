<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Pennylog</title>
  <meta name="description" content="Monthly budget planner: log spending and income, track category budgets and bills, and save toward goals.">
  <meta name="theme-color" content="#0D6B73">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pennylog">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Penny<span>log</span></div>
    <div class="top-r">
      <div class="sync" id="sync"><i></i><span data-i18n="loading">Loading…</span></div>
      <select id="langSel" class="lang" data-i18n-aria="language" aria-label="Language"></select>
      <button class="icon-btn" id="settingsBtn" data-i18n-aria="settingsExport" aria-label="Settings and export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    </div>
  </header>
  <main id="main"><div class="empty" data-i18n="loadingBudget">Loading your budget…</div></main>
</div>

<button class="fab" id="fab" data-i18n-aria="addTxAria" aria-label="Add a transaction"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="add">Add</span></button>

<nav class="tabs" data-i18n-aria="sections" aria-label="Sections"><div class="in2">
  <a href="#month" data-tab="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M6 16V11M11 16V6M16 16v-4M20 16V8"/></svg><span data-i18n="tabMonth">Month</span></a>
  <a href="#spend" data-tab="spend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span data-i18n="tabSpend">Spending</span></a>
  <a href="#budget" data-tab="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg><span data-i18n="tabBudget">Budget</span><span class="badge" id="badgeBudget" hidden></span></a>
  <a href="#goals" data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></svg><span data-i18n="tabGoals">Goals</span></a>
</div></nav>

<div id="sheetHost"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<!-- order matters: translations first, then the app -->
<script src="js/i18n.js" defer></script>
<script src="js/locales/en-GB.js" defer></script>
<script src="js/locales/fi-FI.js" defer></script>
<script src="js/locales/sv-SE.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/register-sw.js" defer></script>
</body>
</html>
